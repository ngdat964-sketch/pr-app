<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<!-- 🔥 BẮT BUỘC -->
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2f3347">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="icon.png">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>QR Access</title>

<style>
html,body{
    margin:0;
    padding:0;
    height:100%;
    background:#2f3347;
    font-family:Arial,sans-serif;
    text-align:center;
    color:#fff;
    touch-action:manipulation;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
}
.name{margin:24px 0 14px;font-size:21px;font-weight:bold;color:#f0d58c;}
.card{width:80%;max-width:320px;margin:0 auto;background:#fff;border-radius:22px;padding-bottom:24px;color:#000;overflow:hidden;}
.card-header{position:relative;background:#ffb703;color:#fff;padding:13px 12px;font-size:14px;}
.card-header::before,.card-header::after{
    content:"";position:absolute;bottom:-7px;width:14px;height:14px;background:#2f3347;border-radius:50%;
}
.card-header::before{left:-7px;}
.card-header::after{right:-7px;}
.datetime{margin:24px 0 14px;font-size:20px;font-weight:bold;white-space:nowrap;}
.qr{margin:6px auto;width:230px;position:relative;}
.qr img{width:100%;transition:opacity .3s ease;}
.qr-loading{
    position:absolute;top:50%;left:50%;width:30px;height:30px;margin:-15px;
    border:3px solid rgba(0,0,0,.25);border-top-color:#ffb703;border-radius:50%;
    animation:spin .8s linear infinite;display:none;
}
@keyframes spin{to{transform:rotate(360deg);}}
.refresh{margin-top:10px;color:#888;font-size:14px;}
.timer{margin-top:8px;font-size:24px;font-weight:bold;color:#2ecc71;}
.note{margin:24px auto;max-width:300px;font-size:14px;color:#bfc3d9;line-height:1.85;text-align:left;}
.note .line{display:block;}
</style>
</head>

<body>

<div class="name">
Cà Văn Trọng (V25021787)
</div>

<div class="card">
<div class="card-header">
将二维码对准扫描器刷新出场
</div>

<div class="datetime" id="datetime"></div>

<div class="qr">
<img id="qrImage" src="qr.png">
<div class="qr-loading" id="qrLoading"></div>
</div>

<div class="refresh" onclick="refreshQR()">刷新二维码</div>
<div class="timer" id="timer">00:00:00</div>
</div>

<div class="note">
<span class="line">尊敬的员工您好，您已进入企业涉密区域，</span>
<span class="line">出于企业安全考虑，您的手机摄像头将被禁止，</span>
<span class="line">感谢您的配合。</span>
</div>

<script>
function updateDateTime(){
    const n=new Date();
    document.getElementById("datetime").innerText=
        n.getFullYear()+"-"+
        String(n.getMonth()+1).padStart(2,"0")+"-"+
        String(n.getDate()).padStart(2,"0")+" "+
        String(n.getHours()).padStart(2,"0")+":"+
        String(n.getMinutes()).padStart(2,"0")+":"+
        String(n.getSeconds()).padStart(2,"0");
}
setInterval(updateDateTime,1000);
updateDateTime();

let seconds=0;
setInterval(()=>{seconds++;renderTimer();},1000);
function renderTimer(){
    document.getElementById("timer").innerText=
        String(Math.floor(seconds/3600)).padStart(2,"0")+":"+
        String(Math.floor((seconds%3600)/60)).padStart(2,"0")+":"+
        String(seconds%60).padStart(2,"0");
}

function refreshQR(){
    const img=document.getElementById("qrImage");
    const loading=document.getElementById("qrLoading");
    img.style.opacity="0.4";
    loading.style.display="block";
    setTimeout(()=>{
        img.src="qr.png?t="+Date.now();
        img.style.opacity="1";
        loading.style.display="none";
    },600);
}
</script>

</body>
</html>
